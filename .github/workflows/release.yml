# Publica as releases do GitHub a partir do CHANGELOG.md.
# - Ao enviar uma tag vX.Y.Z, cria a release dela com as notas da seção [X.Y.Z].
# - Em Actions › Publicar release › Run workflow: informe uma tag, ou deixe em
#   branco para criar as releases de todas as tags do CHANGELOG que ainda não têm.
name: Publicar release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (ex.: v1.2.0). Em branco: todas as que faltam.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Criar releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_ENVIADA: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # versões na ordem do CHANGELOG (a primeira é a mais nova)
          VERSOES=$(grep -oP '^## \[\K[0-9][^\]]*' CHANGELOG.md)
          MAIS_NOVA=$(echo "$VERSOES" | head -1)
          if [ -n "${TAG_ENVIADA:-}" ]; then
            ALVO="${TAG_ENVIADA#v}"
          else
            ALVO=$(echo "$VERSOES" | tac)   # da mais antiga para a mais nova
          fi
          for V in $ALVO; do
            TAG="v$V"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::warning::A tag $TAG não existe, pulando."; continue
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "A release $TAG já existe."; continue
            fi
            awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} f && (/^## / || /^\[/) {exit} f' CHANGELOG.md > notas.md
            if ! grep -q '[^[:space:]]' notas.md; then
              echo "::error::A versão $V não está no CHANGELOG.md"; exit 1
            fi
            cat >> notas.md <<'TXT'

          ### Como instalar
          O Órbita é só para iPhone e não está na App Store. Rode o workflow **Build iOS** em *Actions* para gerar o `.ipa` e instale pelo [Sideloadly](https://sideloadly.io/).

          Histórico completo no [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md).
          TXT
            LATEST=false; [ "$V" = "$MAIS_NOVA" ] && LATEST=true
            gh release create "$TAG" --verify-tag --title "Órbita $V" --notes-file notas.md --latest=$LATEST
          done
