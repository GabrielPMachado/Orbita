# Publica as releases do GitHub a partir do CHANGELOG.md.
# - Ao chegar na main uma mudança no CHANGELOG.md, cria a tag e a release da
#   versão mais nova (a primeira seção ## [X.Y.Z]), se ainda não existirem.
# - Ao enviar uma tag vX.Y.Z, cria a release dela.
# - Em Actions > Publicar release > Run workflow: informe a tag e, se quiser,
#   o commit (para publicar uma versão antiga).
name: Publicar release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (ex.: v1.2.0)'
        required: true
      commit:
        description: 'Commit da versão (em branco: o último da main)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          REF_TIPO: ${{ github.ref_type }}
          REF_NOME: ${{ github.ref_name }}
          TAG_INFORMADA: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          # a primeira seção do CHANGELOG é a versão mais nova
          MAIS_NOVA=$(grep -oP '^## \[\K[0-9][^\]]*' CHANGELOG.md | head -1)
          if [ "$EVENTO" = workflow_dispatch ]; then V="${TAG_INFORMADA#v}"
          elif [ "$REF_TIPO" = tag ]; then V="${REF_NOME#v}"
          else V="$MAIS_NOVA"; fi
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release $TAG já existe."; exit 0
          fi
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} f && (/^## / || /^\[/) {exit} f' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::A versão $V não está no CHANGELOG.md"; exit 1
          fi
          cat >> notas.md <<'TXT'

          ### Como instalar
          O Órbita é só para iPhone e não está na App Store. Rode o workflow **Build iOS** em *Actions* para gerar o `.ipa` e instale pelo [Sideloadly](https://sideloadly.io/).

          Histórico completo no [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md).
          TXT
          LATEST=false; [ "$V" = "$MAIS_NOVA" ] && LATEST=true
          # cria a tag no commit indicado se ela ainda não existir
          gh release create "$TAG" --target "$COMMIT" --title "Órbita $V" --notes-file notas.md --latest=$LATEST
