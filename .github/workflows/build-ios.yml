# Gera um .ipa SEM assinatura num Mac da nuvem do GitHub.
# Depois é só baixar o artefato e instalar no iPhone com o Sideloadly (que assina com o seu Apple ID).
name: Build iOS (.ipa para Sideloadly)

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Escolher o Xcode mais novo (Expo SDK 58 pede 26.4+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Gerar projeto nativo (expo prebuild)
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Compilar (Release, sem assinatura)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS / Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Embutir entitlements (App Group do widget)
        # Sem assinatura o binário sai sem entitlements e o Sideloadly não saberia que app e widget
        # compartilham o App Group. Uma assinatura ad-hoc grava os entitlements; o Sideloadly
        # reassina com o seu Apple ID mantendo-os. O push remoto sai (só usamos notificação local).
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          MAIN=$(ls ios/*/*.entitlements | grep -v ExpoWidgetsTarget | head -1)
          cp "$MAIN" /tmp/app.entitlements
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" /tmp/app.entitlements 2>/dev/null || true
          # código embutido primeiro (frameworks), depois a extensão, por último o app
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) -prune | while read -r F; do codesign -f -s - "$F"; done
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -e "$EXT" ] || continue
            codesign -f -s - --entitlements ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements "$EXT"
          done
          codesign -f -s - --entitlements /tmp/app.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry Orbita.ipa Payload
          ls -lh Orbita.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-ipa
          path: Orbita.ipa
          retention-days: 14
