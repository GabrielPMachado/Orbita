# Checagem de tipos e build web em todo push na main e em todo pull request.
# (O .ipa é gerado pelo build-ios.yml.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos e build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Scripts injetados nas páginas (sintaxe)
        run: npm run check:injected

      - name: Build web (expo export)
        run: npx expo export --platform web --output-dir dist-ci
